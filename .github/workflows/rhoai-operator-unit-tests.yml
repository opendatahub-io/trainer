name: Operator Unit Tests

on:
  push:
    branches:
      - main
    paths:
      - "rhoai/operator/**"
      - "pkg/apis/**"
      - "manifests/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/rhoai-operator-unit-tests.yml"
  pull_request:
    paths:
      - "rhoai/operator/**"
      - "pkg/apis/**"
      - "manifests/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/rhoai-operator-unit-tests.yml"

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: rhoai/operator
    steps:
      - name: Clone the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: rhoai/operator/go.mod

      - name: Verify generated files are up to date
        run: |
          make manifests generate fmt
          git diff --exit-code

      - name: Running Tests
        run: |
          go mod tidy -diff
          make test
