name: Operator E2E Tests

on:
  push:
    branches:
      - main
    paths:
      - "rhoai/operator/**"
      - "pkg/**"
      - "cmd/trainer-controller-manager/**"
      - "manifests/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/rhoai-operator-e2e.yml"
  pull_request:
    paths:
      - "rhoai/operator/**"
      - "pkg/**"
      - "cmd/trainer-controller-manager/**"
      - "manifests/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/rhoai-operator-e2e.yml"

jobs:
  test-e2e:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: rhoai/operator
    steps:
      - name: Clone the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: rhoai/operator/go.mod

      - name: Verify generated files are up to date
        run: |
          make manifests generate fmt
          git diff --exit-code

      - name: Install kind
        run: |
          curl -Lo ./kind https://github.com/kubernetes-sigs/kind/releases/download/v0.32.0/kind-linux-amd64
          echo "50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  ./kind" | sha256sum -c
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Increase inotify limits
        run: |
          sudo sysctl fs.inotify.max_user_instances=1024
          sudo sysctl fs.inotify.max_user_watches=1048576

      - name: Running Test e2e
        run: |
          go mod tidy -diff
          make test-e2e CONTAINER_TOOL=docker
