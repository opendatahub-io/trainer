name: Operator Lint

on:
  push:
    branches:
      - main
    paths:
      - "rhoai/operator/**"
      - "pkg/apis/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/rhoai-operator-lint.yml"
  pull_request:
    paths:
      - "rhoai/operator/**"
      - "pkg/apis/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/rhoai-operator-lint.yml"

jobs:
  lint:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: rhoai/operator
    steps:
      - name: Clone the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: rhoai/operator/go.mod

      - name: Run linter
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.13.0
          working-directory: rhoai/operator

      - name: Lint rendered manifests
        run: make lint-manifests
