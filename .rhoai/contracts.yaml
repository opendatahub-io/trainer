# API contract set for opendatahub-io/trainer (RHOAIENG-103150, RHOAIENG-103156).
# Runner, schemas, and reusable workflows:
# https://github.com/red-hat-data-services/api-contract-tests
apiVersion: contracts.rhoai.io/v1alpha1
kind: ContractSet
metadata:
  name: trainer
spec:
  # Repository default baseline: 1d0c3d05bafaf55586e6abd93f05492755a182e6,
  # the merge of opendatahub-io/trainer#322 that imported the trainer-operator
  # into this repository. Both CRD sets are byte-identical there to what
  # shipped in RHOAI 3.6: the trainer CRDs match the 3.6 release base
  # (merge base of rhoai-3.6 and main, aa9769ac), and the operator CRD
  # matches the trainer-operator repository's odh-3.6.0 release tag
  # (fe2cdae7). Verified 2026-11-13. Moving the baseline forward needs
  # approval from someone other than the author.
  baseline:
    refs:
      - 1d0c3d05bafaf55586e6abd93f05492755a182e6
  # Trainer has no REST API: this repository ships CRD-driven controllers.
  # The one OpenAPI document is api/openapi-spec/swagger.json, a
  # definitions-only file (zero paths) that openapi-gen writes from the CRD
  # types as the input to Python SDK generation; it carries no information
  # beyond the CRDs, so the CRD compatibility checks in
  # .github/workflows/api-contract.yml cover it and it is excluded here.
  contracts: []
  exclusions:
    - path: api/openapi-spec/swagger.json
      reason: >-
        Definitions-only OpenAPI document (no paths) generated by openapi-gen
        from the CRD types as the input to Python SDK generation; not a
        servable API contract. The schemas it carries are the CRD types,
        covered by the CRD compatibility checks.
