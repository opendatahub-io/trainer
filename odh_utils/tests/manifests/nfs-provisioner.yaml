apiVersion: cache.jhouse.com/v1alpha1
kind: NFSProvisioner
metadata:
  name: nfs-provisioner
  namespace: openshift-operators
spec:
  nfsImageConfiguration:
    image: registry.k8s.io/sig-storage/nfs-provisioner@sha256:e943bb77c7df05ebdc8c7888b2db289b13bf9f012d6a3a5a74f14d4d5743d439
    imagePullPolicy: IfNotPresent
  scForNFS: nfs
  # Replaced by install-nfs-provisioner with a StorageClass available on the cluster.
  scForNFSPvc: __NFS_BACKING_STORAGE_CLASS__
  storageSize: 100G
