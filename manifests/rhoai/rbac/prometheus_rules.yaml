apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubeflow-trainer-prometheus-rules
rules:
  - apiGroups:
      - monitoring.coreos.com
    resources:
      - prometheusrules
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubeflow-trainer-prometheus-rules
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubeflow-trainer-prometheus-rules
subjects:
  - kind: ServiceAccount
    name: kubeflow-trainer-controller-manager
    namespace: opendatahub
