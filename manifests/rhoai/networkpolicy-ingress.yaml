apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubeflow-trainer-controller-manager
  labels:
    app.kubernetes.io/name: trainer
    app.kubernetes.io/component: manager
    app.kubernetes.io/part-of: kubeflow
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trainer
      app.kubernetes.io/component: manager
      app.kubernetes.io/part-of: kubeflow
  policyTypes:
    - Ingress
  ingress:
    # API server webhooks and health checks.
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/host-network: ""
          podSelector: {}
      ports:
        - port: health
          protocol: TCP
        - port: webhook
          protocol: TCP
    # TrainJob status updates.
    - from:
        - namespaceSelector: {}
          podSelector:
            matchExpressions:
              - key: jobset.sigs.k8s.io/jobset-name
                operator: Exists
        - namespaceSelector: {}
          podSelector:
            matchExpressions:
              - key: training.kubeflow.org/job-name
                operator: Exists
      ports:
        - port: status-server
          protocol: TCP
    # Secure Prometheus metrics.
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: monitoring
      ports:
        - port: metrics
          protocol: TCP
