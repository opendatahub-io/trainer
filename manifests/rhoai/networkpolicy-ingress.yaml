apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubeflow-trainer-controller-manager
  labels:
    app.kubernetes.io/name: trainer
    app.kubernetes.io/component: manager
    app.kubernetes.io/part-of: kubeflow
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trainer
      app.kubernetes.io/part-of: kubeflow
  policyTypes:
    - Ingress
  ingress:
    # API server webhooks and health checks.
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/host-network: ""
          podSelector: {}
        # Node and pod CIDRs are configured by the downstream overlay.
        - ipBlock:
            cidr: 10.0.0.0/16
        - ipBlock:
            cidr: 10.128.0.0/14
      ports:
        - port: 443
          protocol: TCP
        - port: 8081
          protocol: TCP
        - port: 9443
          protocol: TCP
    # TrainJob status updates.
    - from:
        - namespaceSelector: {}
          podSelector: {}
      ports:
        - port: 10443
          protocol: TCP
    # Secure Prometheus metrics.
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redhat-ods-monitoring
      ports:
        - port: 8443
          protocol: TCP
