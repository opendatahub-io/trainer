# File-scoped tls-config-lint exceptions (pattern-id:path).
# Managed by security-config; changes require security review.

# pkg/statusserver/setup.go: probeChecker() dials localhost to verify the
# status-server TLS listener is alive — identical to the controller-runtime
# webhook probe pattern. InsecureSkipVerify is required because the probe
# dials ":<port>" with no SNI, so there is no server name to validate against.
# Ref: https://github.com/kubernetes-sigs/controller-runtime/blob/v0.24.1/pkg/webhook/server.go#L274-L276
exceptions:
  - insecure-skip-verify:pkg/statusserver/setup.go
